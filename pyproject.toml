[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crest"
version = "1.0.0"
description = "CREST: outcome-constrained inference control plane for agent execution"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
crest = "crest.cli:main"

[project.optional-dependencies]
product = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["crest*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
