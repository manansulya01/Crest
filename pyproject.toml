[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crest"
version = "0.2.0"
description = "Crest: capability admission control plane for agent tool execution"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
crest = "crest.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["crest*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
